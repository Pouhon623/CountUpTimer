<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カウントアップタイマー</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            touch-action: manipulation;
            user-select: none;
        }
        #timer-container {
            background-color: #fff;
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 30px 10px;
            margin: 20px auto;
            max-width: 400px;
            cursor: pointer;
        }
        #timer { 
            font-size: 3.5em; 
            font-weight: bold; 
            font-variant-numeric: tabular-nums; 
            color: #333333; /* 停止中の色 */
            transition: color 0.1s ease;
        }
        .hint { font-size: 0.85em; color: #666; margin-top: 5px; }

        .btn-group { margin: 15px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { 
            font-size: 1.1em; 
            padding: 12px 20px; 
            border: none;
            border-radius: 8px;
            cursor: pointer; 
            min-width: 80px;
        }
        .edit-btn { background-color: #e0e0e0; color: #333; }
        #start { background-color: #4CAF50; color: white; }
        #stop { background-color: #f44336; color: white; }
        #reset { background-color: #ff9800; color: white; }
        
        button:active, #timer-container:active { opacity: 0.7; }
    </style>
</head>
<body>

    <div id="timer-container">
        <div id="timer">00:00:00</div>
        <div class="hint">📱画面タップ：スタート/ストップ<br>長押し：リセット</div>
    </div>
    
    <div class="btn-group">
        <button id="add1s" class="edit-btn">+1秒</button>
        <button id="add10s" class="edit-btn">+10秒</button>
        <button id="add1m" class="edit-btn">+1分</button>
    </div>
    
    <div class="btn-group">
        <button id="start">スタート</button>
        <button id="stop">ストップ</button>
        <button id="reset">リセット</button>
    </div>

    <!-- プログラムをここに直接埋め込みました -->
    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerId = null;

        const timerDisplay = document.getElementById('timer');
        const timerContainer = document.getElementById('timer-container');
        const startButton = document.getElementById('start');
        const stopButton = document.getElementById('stop');
        const resetButton = document.getElementById('reset');

        const add1sButton = document.getElementById('add1s');
        const add10sButton = document.getElementById('add10s');
        const add1mButton = document.getElementById('add1m');

        // 文字色を切り替える関数
        function updateColor() {
            if (timerId !== null) {
                timerDisplay.style.setProperty('color', '#007bff', 'important'); // 確実にブルーにする
            } else {
                timerDisplay.style.setProperty('color', '#333333', 'important'); // 停止時は黒
            }
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            return [
                String(hours).padStart(2, '0'),
                String(minutes).padStart(2, '0'),
                String(seconds).padStart(2, '0')
            ].join(':');
        }

        function updateTimer() {
            const currentTime = Date.now();
            elapsedTime = currentTime - startTime;
            timerDisplay.textContent = formatTime(elapsedTime);
        }

        function addTime(seconds) {
            if (timerId !== null) return;
            elapsedTime += seconds * 1000;
            timerDisplay.textContent = formatTime(elapsedTime);
        }

        add1sButton.addEventListener('click', () => addTime(1));
        add10sButton.addEventListener('click', () => addTime(10));
        add1mButton.addEventListener('click', () => addTime(60));

        // スタート
        startButton.addEventListener('click', () => {
            if (timerId !== null) return;
            startTime = Date.now() - elapsedTime;
            timerId = setInterval(updateTimer, 1000);
            updateColor();
        });

        // ストップ
        stopButton.addEventListener('click', () => {
            clearInterval(timerId);
            timerId = null;
            updateColor();
        });

        // リセット
        resetButton.addEventListener('click', () => {
            clearInterval(timerId);
            timerId = null;
            elapsedTime = 0;
            timerDisplay.textContent = '00:00:00';
            updateColor();
        });

        // キーボード操作
        window.addEventListener('keydown', (event) => {
            if (event.key === ' ' || event.key === 'Spacebar') {
                event.preventDefault();
                if (timerId === null) { startButton.click(); } else { stopButton.click(); }
            }
            if (event.key === 'Escape' || event.key === 'Esc') {
                event.preventDefault();
                resetButton.click();
            }
        });

        // スマホ・PCクリック共通操作
        let touchTimer = null;
        let isLongTouch = false;

        timerContainer.addEventListener('touchstart', (e) => {
            isLongTouch = false;
            touchTimer = setTimeout(() => {
                isLongTouch = true;
                resetButton.click();
                if (navigator.vibrate) navigator.vibrate(50); 
            }, 600);
        });

        timerContainer.addEventListener('touchend', (e) => {
            clearTimeout(touchTimer);
            if (!isLongTouch) {
                if (timerId === null) { startButton.click(); } else { stopButton.click(); }
            }
            e.preventDefault();
        });

        timerContainer.addEventListener('touchmove', () => {
            clearTimeout(touchTimer);
        });
    </script>
</body>
</html>

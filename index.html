<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カウントアップタイマー</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            touch-action: manipulation;
            user-select: none;
        }
        #timer-container {
            background-color: #fff;
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 30px 10px;
            margin: 20px auto;
            max-width: 400px;
            cursor: pointer;
        }
        
        /* 停止中と進行中のスタイル優先度を均等に設定 */
        .timer-text { 
            font-size: 3.5em; 
            font-weight: bold; 
            font-variant-numeric: tabular-nums; 
            color: #333333; /* 停止中は黒 */
            transition: color 0.1s ease;
        }
        /* 進行中は鮮やかなブルーに切り替え */
        .timer-text.running {
            color: #007bff; 
        }

        .hint { font-size: 0.85em; color: #666; margin-top: 5px; }
        .btn-group { margin: 15px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { 
            font-size: 1.1em; 
            padding: 12px 20px; 
            border: none;
            border-radius: 8px;
            cursor: pointer; 
            min-width: 80px;
        }
        .edit-btn { background-color: #e0e0e0; color: #333; }
        #start { background-color: #4CAF50; color: white; }
        #stop { background-color: #f44336; color: white; }
        #reset { background-color: #ff9800; color: white; }
        
        button:active, #timer-container:active { opacity: 0.7; }
    </style>
</head>
<body>

    <div id="timer-container">
        <!-- class="timer-text" を付与 -->
        <div id="timer" class="timer-text">00:00</div>
        <div class="hint">📱画面タップ：スタート/ストップ<br>長押し：リセット</div>
    </div>
    
    <div class="btn-group">
        <button id="add1s" class="edit-btn">+1秒</button>
        <button id="add10s" class="edit-btn">+10秒</button>
        <button id="add1m" class="edit-btn">+1分</button>
    </div>
    
    <div class="btn-group">
        <button id="start">スタート</button>
        <button id="stop">ストップ</button>
        <button id="reset">リセット</button>
    </div>

    <!-- 末尾でJavaScriptファイルを読み込み -->
    <script src="main.js"></script>
</body>
</html>
